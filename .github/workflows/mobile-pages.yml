# Testa o projeto e publica o app para celular (PWA offline) no GitHub Pages a cada push na main.
name: App para celular (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CAHIER_DATA_DIR: ${{ runner.temp }}/cahier-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Testes (Django + paridade com o celular)
        run: python manage.py test tests --noinput
      - name: Testes do núcleo JavaScript
        run: node --test mobile/tests/core.test.mjs
      - name: Gerar o app com o conteúdo inicial
        run: |
          python manage.py migrate --noinput
          python manage.py seed_content
          python manage.py build_mobile --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
